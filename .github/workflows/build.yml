name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter create --platforms=android --org com.ccz --project-name reporte_defectos .
          rm -rf test
          G=android/app/build.gradle.kts
          [ -f "$G" ] || G=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/; s/ndkVersion flutter.ndkVersion/ndkVersion "27.0.12077973"/' "$G"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="reporte_defectos"/android:label="Reporte CCZ"/' "$M"
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$M"
          echo "---- $G"; grep -nE 'minSdk|ndkVersion|applicationId' "$G"

      - run: flutter pub get

      - name: Revisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk ReporteCCZ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReporteCCZ-apk
          path: ReporteCCZ.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Reporte CCZ - versión ${{ github.run_number }}
          body: Descarga ReporteCCZ.apk desde el teléfono Android e instálalo.
          files: ReporteCCZ.apk
          make_latest: true
